<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NinjaToolKit v9: the film</title>
<meta name="description" content="NinjaToolKit v9 inside and out: the machinery drawn from measured figures, and the real v9.0.1 program working an invented estate.">
<link rel="stylesheet" href="../assets/base.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #040405; }
  #wrap { position: fixed; inset: 0 0 54px 0; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; margin: -540px 0 0 -960px; width: 1920px; height: 1080px; transform-origin: 50% 50%; background: #060607; overflow: hidden; }
  /* a clip plays still: no camera moves over it, it is only scaled to fit the window */
  #v { position: absolute; inset: 0; width: 1920px; height: 1080px; background: #060607; object-fit: contain; opacity: 0; transition: opacity .3s; }
  #stage.clip #v { opacity: 1; }
  #stage.cut #v { opacity: 0; transition: opacity .12s; }
  #dc { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; transition: opacity .5s; }
  #stage.draw #dc { opacity: 1; }
  #loomc { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; transition: opacity .9s; }
  #stage.card #loomc { opacity: .85; }
  #shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s;
    background: linear-gradient(180deg, rgba(4,4,5,0) 0, rgba(4,4,5,0) 70%, rgba(4,4,5,.86) 86%, rgba(4,4,5,.95) 100%); }
  #stage.clip.said #shade { opacity: 1; }
  #stage.card #shade { opacity: 1; background: linear-gradient(90deg, rgba(4,4,5,.95) 0, rgba(4,4,5,.9) 44%, rgba(4,4,5,0) 64%); }
  /* the caption: what to watch, said once, with the scene's source above it */
  #cap { position: absolute; left: 64px; right: 360px; bottom: 58px; padding-left: 26px; border-left: 2px solid var(--gate);
    opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
  #cap.on { opacity: 1; transform: none; }
  #cap .src { font: 500 14px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--ink3); margin-bottom: 12px; }
  #cap .src b { font-weight: 500; color: var(--gate); margin-right: 18px; }
  #cap .line { font: 300 42px/1.18 var(--sans); letter-spacing: -.02em; color: var(--ink); text-wrap: balance; }
  #cap small { display: block; margin-top: 12px; font: 400 21px/1.42 var(--sans); color: var(--ink2); text-wrap: pretty; }
  /* a card: the act's name, a line, and what it holds */
  #title { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 0 0 0 150px; }
  #stage.card #title { display: flex; }
  #title .eyebrow { font: 500 17px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gate); min-height: 24px; }
  #title h1 { font: 300 84px/1.05 var(--sans); letter-spacing: -.03em; margin: 22px 0 26px; max-width: 1180px; min-height: 90px; }
  #title p { font: 300 32px/1.36 var(--sans); letter-spacing: -.01em; color: var(--ink2); max-width: 980px; margin: 0; min-height: 44px; }
  #title .by { margin-top: 30px; font: 400 26px var(--sans); color: var(--ink); min-height: 34px; }
  #title .by span { color: var(--ink3); }
  #title .foot { margin-top: 44px; font: 400 19px/1.5 var(--sans); color: var(--ink3); max-width: 960px; opacity: 0; transition: opacity .8s; }
  #title .foot.on { opacity: 1; }
  #start { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(4,4,5,.72); cursor: pointer; transition: opacity .5s; }
  #start.off { opacity: 0; pointer-events: none; }
  #start div { text-align: center; }
  #start span { display: inline-block; font: 400 26px var(--sans); color: var(--ink); padding: 20px 40px; border: 1px solid var(--ink3); border-radius: 2px; }
  #start span::before { content: ""; display: inline-block; border: 10px solid transparent; border-left: 16px solid var(--gate); margin: 0 6px -2px 0; }
  #start em { display: block; margin-top: 22px; font: 400 18px/1.5 var(--sans); font-style: normal; color: var(--ink3); }
  /* the rail: every scene a segment, in order */
  #bar { position: fixed; inset: auto 0 0 0; height: 54px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: #040405; border-top: 1px solid var(--line); }
  #bar button { all: unset; cursor: pointer; font: 500 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); padding: 8px 2px; min-width: 46px; }
  #bar button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
  #rail { flex: 1; display: flex; gap: 3px; height: 22px; align-items: center; }
  #rail a { position: relative; height: 3px; background: var(--line2); cursor: pointer; }
  #rail a::after { content: ""; position: absolute; inset: -10px 0; }
  #rail a i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink2); }
  #rail a.past i { width: 100%; } #rail a.now i { background: var(--gate); }
  #rail a:hover { background: var(--line3); }
  #name { font: 400 12px var(--mono); color: var(--ink3); min-width: 330px; text-align: right; white-space: nowrap; }
  #back { text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" class="card">
    <canvas id="loomc" aria-hidden="true"></canvas>
    <video id="v" muted playsinline preload="auto"></video>
    <canvas id="dc" aria-hidden="true"></canvas>
    <div id="shade"></div>
    <div id="title"><div class="eyebrow" id="tE"></div><h1 id="tH"></h1><p id="tP"></p><div class="by" id="tB"></div><div class="foot" id="tF"></div></div>
    <div id="cap"><div class="src" id="cS"></div><div class="line" id="cL"></div></div>
    <div id="start"><div><span>Play the film</span><em id="startNote"></em></div></div>
  </div>
</div>
<div id="bar">
  <a id="back" class="label" href="../index.html">NinjaToolKit</a>
  <button id="pp" type="button" aria-label="Play or pause">Play</button>
  <div id="rail"></div>
  <span id="name"></span>
</div>

<script src="../assets/loom.js"></script>
<script src="events.js"></script>
<script src="scenes.js"></script>
<script src="film.js"></script>
</body>
</html>
